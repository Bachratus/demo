spring:
  application:
    name: demo
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://demo-db:5432/demo}
    username: ${DB_USERNAME:demo_user}
    password: ${DB_PASSWORD:demo_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: true
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory
          redisson:
            config: redisson.yaml
            fallback: true
        show_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
#      username: default
#      password: secret
#      database: 0
#      timeout: 3s
#
#      lettuce:
#        pool:
#          enabled: true
#          max-active: 16
#          max-idle: 8
#          min-idle: 2
#          max-wait: 1s
#        shutdown-timeout: 100ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:9092,kafka2:9092,kafka3:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[delivery.timeout.ms]": 45000
        "[spring.json.type.mapping]": "demo-event-v1:com.bachratus.demo.infra.kafka.DemoEvent"
    consumer:
      group-id: demo-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.type.mapping]": "demo-event-v1:com.bachratus.demo.infra.kafka.DemoEvent"
        "[spring.json.remove.type.headers]": false
        "[spring.json.trusted.packages]": com.bachratus.demo.infra.kafka
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/bachratus}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/bachratus/protocol/openid-connect/certs}

logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
  level:
    org.apache.kafka: ${KAFKA_CLIENT_LOGGING_LEVEL:WARN}
    org.springframework.kafka: ${SPRING_KAFKA_LOGGING_LEVEL:WARN}

demo:
  kafka:
    partitions: ${DEMO_KAFKA_PARTITIONS:3}
    replicas: ${DEMO_KAFKA_REPLICAS:3}
    topics:
      events: ${DEMO_KAFKA_TOPIC_EVENTS:demo-events}
