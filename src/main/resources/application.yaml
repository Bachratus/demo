spring:
  application:
    name: demo
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://demo-db:5432/demo}
    username: ${DB_USERNAME:demo_user}
    password: ${DB_PASSWORD:demo_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: ${HIBERNATE_GENERATE_STATISTICS:false}
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory
          redisson:
            config: redisson.yaml
            fallback: true
        show_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
#      username: default
#      password: secret
#      database: 0
#      timeout: 3s
#
#      lettuce:
#        pool:
#          enabled: true
#          max-active: 16
#          max-idle: 8
#          min-idle: 2
#          max-wait: 1s
#        shutdown-timeout: 100ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:9092,kafka2:9092,kafka3:9092}
    producer:
      acks: ${DEMO_KAFKA_PRODUCER_ACKS:all}
      retries: ${DEMO_KAFKA_PRODUCER_RETRIES:10}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": ${DEMO_KAFKA_PRODUCER_IDEMPOTENCE:true}
        "[delivery.timeout.ms]": ${DEMO_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:45000}
        "[request.timeout.ms]": ${DEMO_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:15000}
        "[linger.ms]": ${DEMO_KAFKA_PRODUCER_LINGER_MS:5}
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: demo-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.value.default.type]": com.fasterxml.jackson.databind.JsonNode
        "[spring.json.trusted.packages]": com.bachratus.demo.*,com.fasterxml.jackson.databind
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/bachratus}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/bachratus/protocol/openid-connect/certs}

logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
  level:
    org.apache.kafka: ${KAFKA_CLIENT_LOGGING_LEVEL:WARN}
    org.springframework.kafka: ${SPRING_KAFKA_LOGGING_LEVEL:WARN}
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: ${HIBERNATE_STATISTICS_LOGGING_LEVEL:OFF}

app:
  kafka:
    enabled: ${DEMO_KAFKA_ENABLED:true} # Główny kill switch dla integracji z Kafką
    producer:
      # delivery-timeout-ms, request-timeout-ms i linger-ms w app.kafka.producer są obecnie lustrzanym odbiciem spring.kafka.producer.properties.
      # Realnie klienta konfiguruje spring.kafka.*; app.kafka jest używane w naszej klasie AppKafkaProperties do walidacji spójności
      # send-result-timeout-ms jest już czysto aplikacyjną wartością
      delivery-timeout-ms: ${DEMO_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:45000} # Całkowity deadline producenta Kafki na dostarczenie rekordu
      request-timeout-ms: ${DEMO_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:15000} # Timeout pojedynczego request do brokera. Musi być mniejszy niż delivery-timeout-ms
      linger-ms: ${DEMO_KAFKA_PRODUCER_LINGER_MS:5} # Mówi producentowi, ile może chwilę poczekać przed wysłaniem batcha
      send-result-timeout-ms: ${DEMO_KAFKA_PRODUCER_SEND_RESULT_TIMEOUT_MS:50000} # to timeout aplikacyjny używany przez nasz OutboxKafkaPublisher przy send
    listener:
      retry-interval-ms: ${DEMO_KAFKA_LISTENER_RETRY_INTERVAL_MS:1000} # Przerwa między kolejnymi próbami obsługi wiadomości po błędzie
      max-attempts: ${DEMO_KAFKA_LISTENER_MAX_ATTEMPTS:3} # Łączna liczba prób. Dla max-attempts = 3: pierwsza próba, retry, retry, DLT
      # Po wyczerpaniu prób Springowy DefaultErrorHandler używa DeadLetterPublishingRecoverer, a ten pyta KafkaDeadLetterTopicResolver, na jaki DLT topic wysłać wiadomość.
    outbox:
      # To jest konfiguracja naszego publishera outboxa, czyli mechanizmu, który czyta rekordy z tabeli outbox_event i publikuje je do Kafki.
      enabled: ${DEMO_KAFKA_OUTBOX_ENABLED:true} # Wyłącza tylko publikowanie z outboxa do Kafki. To nie musi wyłączać całej Kafki.
      batch-size: ${DEMO_KAFKA_OUTBOX_BATCH_SIZE:100} # Maksymalna liczba rekordów outboxa pobieranych w jednym przebiegu publishera. Jest używane w query z LIMIT :batchSize
      poll-delay-ms: ${DEMO_KAFKA_OUTBOX_POLL_DELAY_MS:500} # Delay schedulera. Publisher odpala batch, kończy robotę, czeka 500ms, potem odpala następny. To jest fixedDelay, czyli liczone po zakończeniu poprzedniego wykonania, nie od jego startu.
      retry-backoff-ms: ${DEMO_KAFKA_OUTBOX_RETRY_BACKOFF_MS:10000} # Czas do kolejnej próby po błędzie. Gdy publish się wywali, encja ustawia: nextAttemptAt = now.plusMillis(retryBackoffMs)
      max-attempts: ${DEMO_KAFKA_OUTBOX_MAX_ATTEMPTS:5} # Maksymalna liczba prób publikacji na główny topic. Po osiągnięciu limitu event przechodzi w status DLT_PENDING i publisher próbuje wysłać go na DLT
    topics:
      # Mapa konfiguracji eventów/topiców. Kluczem jest logiczny event key
      # Ten key odpowiada temu, co event aplikacyjny zwraca z eventKey()
      customer-account-created:
        name: ${DEMO_KAFKA_TOPIC_CUSTOMER_ACCOUNT_CREATED:store.customer-account-created.v1} # Fizyczna nazwa topicu w Kafce
        concurrency: ${DEMO_KAFKA_TOPIC_CUSTOMER_ACCOUNT_CREATED_CONCURRENCY:3} # Liczba równoległych wątków/consumerów dla listenera
        dlt-name: ${DEMO_KAFKA_TOPIC_CUSTOMER_ACCOUNT_CREATED_DLT:store.customer-account-created.v1.dlt} # Fizyczna nazwa dead-letter topicu
        event-type: ${DEMO_KAFKA_EVENT_CUSTOMER_ACCOUNT_CREATED_TYPE:customer.account-created}  # Semantyczny typ eventu, ale bez wersji. Finalnie w outboxie i headerze Kafka dostaniemy customer.account-created.v1 (przy schema version 1)
        aggregate-type: ${DEMO_KAFKA_EVENT_CUSTOMER_ACCOUNT_CREATED_AGGREGATE_TYPE:customer} # Typ agregatu, którego dotyczy event. Publisher wrzuca to m.in. w header: aggregate-type: customer
