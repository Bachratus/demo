spring:
  application:
    name: demo
  datasource:
    url: ${JDBC_URL:jdbc:postgresql://demo-db:5432/demo}
    username: ${DB_USERNAME:demo_user}
    password: ${DB_PASSWORD:demo_password}
    driver-class-name: org.postgresql.Driver
    hikari:
      data-source-properties:
        reWriteBatchedInserts: true
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_POOL_CONNECTION_TIMEOUT:2000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:1000}
      max-lifetime: ${DB_POOL_MAX_LIFETIME:1800000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: ${HIBERNATE_GENERATE_STATISTICS:false}
        cache:
          use_second_level_cache: true
          use_query_cache: true
          region:
            factory_class: org.redisson.hibernate.RedissonRegionFactory
          redisson:
            config: redisson.yaml
            fallback: true
        show_sql: false
  data:
    redis:
      host: ${SPRING_REDIS_HOST:redis}
      port: ${SPRING_REDIS_PORT:6379}
#      username: default
#      password: secret
#      database: 0
#      timeout: 3s
#
#      lettuce:
#        pool:
#          enabled: true
#          max-active: 16
#          max-idle: 8
#          min-idle: 2
#          max-wait: 1s
#        shutdown-timeout: 100ms
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka1:9092,kafka2:9092,kafka3:9092}
    producer:
      acks: ${DEMO_KAFKA_PRODUCER_ACKS:all}
      retries: ${DEMO_KAFKA_PRODUCER_RETRIES:10}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[enable.idempotence]": ${DEMO_KAFKA_PRODUCER_IDEMPOTENCE:true}
        "[delivery.timeout.ms]": ${DEMO_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:45000}
        "[request.timeout.ms]": ${DEMO_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:15000}
        "[linger.ms]": ${DEMO_KAFKA_PRODUCER_LINGER_MS:5}
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: demo-app
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.springframework.kafka.support.serializer.JsonDeserializer
        "[spring.json.value.default.type]": com.fasterxml.jackson.databind.JsonNode
        "[spring.json.trusted.packages]": com.bachratus.demo.*,com.fasterxml.jackson.databind
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OAUTH2_ISSUER_URI:http://localhost:8080/realms/bachratus}
          jwk-set-uri: ${OAUTH2_JWK_SET_URI:http://keycloak:8080/realms/bachratus/protocol/openid-connect/certs}

logging:
  pattern:
    console: ${LOG_PATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}
  level:
    org.apache.kafka: ${KAFKA_CLIENT_LOGGING_LEVEL:WARN}
    org.springframework.kafka: ${SPRING_KAFKA_LOGGING_LEVEL:WARN}
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: ${HIBERNATE_STATISTICS_LOGGING_LEVEL:OFF}

app:
  kafka:
    enabled: ${DEMO_KAFKA_ENABLED:true}
    producer:
      delivery-timeout-ms: ${DEMO_KAFKA_PRODUCER_DELIVERY_TIMEOUT_MS:45000}
      request-timeout-ms: ${DEMO_KAFKA_PRODUCER_REQUEST_TIMEOUT_MS:15000}
      linger-ms: ${DEMO_KAFKA_PRODUCER_LINGER_MS:5}
      send-result-timeout-ms: ${DEMO_KAFKA_PRODUCER_SEND_RESULT_TIMEOUT_MS:50000}
    listener:
      retry-interval-ms: ${DEMO_KAFKA_LISTENER_RETRY_INTERVAL_MS:1000}
      max-attempts: ${DEMO_KAFKA_LISTENER_MAX_ATTEMPTS:3}
    outbox:
      enabled: ${DEMO_KAFKA_OUTBOX_ENABLED:true}
      batch-size: ${DEMO_KAFKA_OUTBOX_BATCH_SIZE:100}
      poll-delay-ms: ${DEMO_KAFKA_OUTBOX_POLL_DELAY_MS:500}
      retry-backoff-ms: ${DEMO_KAFKA_OUTBOX_RETRY_BACKOFF_MS:10000}
      max-attempts: ${DEMO_KAFKA_OUTBOX_MAX_ATTEMPTS:5}
    topics:
      customer-account-created:
        name: ${DEMO_KAFKA_TOPIC_CUSTOMER_ACCOUNT_CREATED:store.customer-account-created.v1}
        concurrency: ${DEMO_KAFKA_TOPIC_CUSTOMER_ACCOUNT_CREATED_CONCURRENCY:3}
        dlt-name: ${DEMO_KAFKA_TOPIC_CUSTOMER_ACCOUNT_CREATED_DLT:store.customer-account-created.v1.dlt}
        event-type: ${DEMO_KAFKA_EVENT_CUSTOMER_ACCOUNT_CREATED_TYPE:customer.account-created}
        aggregate-type: ${DEMO_KAFKA_EVENT_CUSTOMER_ACCOUNT_CREATED_AGGREGATE_TYPE:customer}
